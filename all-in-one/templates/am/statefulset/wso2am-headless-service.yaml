{{- if .Values.wso2.deployment.statefulSet.enabled }}
# Gives each StatefulSet pod a DNS name (<fullname>-am-<n>.<fullname>-am-headless) used between the nodes
apiVersion: v1
kind: Service
metadata:
  name: {{ template "am-all-in-one.fullname" . }}-am-headless
  namespace : {{ .Release.Namespace }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    deployment: {{ template "am-all-in-one.fullname" . }}-am
{{- end }}
